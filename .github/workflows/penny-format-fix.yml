name: penny-format-fix

on:
  push:
    branches:
      - feature/penny-v0-2-learning-engine
    paths:
      - ".penny-format-fix/**"
      - ".github/workflows/penny-format-fix.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify and apply formatted files
        shell: bash
        run: |
          set -euo pipefail
          cat .penny-format-fix/payload.part-* | base64 --decode > /tmp/penny-format-fix.tar.xz
          echo "be545eea4d8610db8b8855fb0f3902bb94090a3b6df8de228a03d1159a47d7f6  /tmp/penny-format-fix.tar.xz" | sha256sum --check
          tar -tJf /tmp/penny-format-fix.tar.xz
          tar -xJf /tmp/penny-format-fix.tar.xz
          rm -rf .penny-format-fix

      - name: Commit formatted files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'style: format $penny learning engine'
          git push
