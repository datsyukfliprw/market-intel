name: penny-bootstrap

on:
  push:
    branches:
      - feature/penny-v0-2-learning-engine
    paths:
      - ".penny-bootstrap/**"
      - ".github/workflows/penny-bootstrap.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  expand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify and extract payload
        shell: bash
        run: |
          set -euo pipefail
          test -f .penny-bootstrap/payload.part-00
          cat .penny-bootstrap/payload.part-* | base64 --decode > /tmp/penny-v02.tar.xz
          echo "0acc7c1588ee3fd2b57626bb32382a33ebecd4759aa04f855a3edbcaced1d4b8  /tmp/penny-v02.tar.xz" | sha256sum --check
          tar -tJf /tmp/penny-v02.tar.xz
          tar -xJf /tmp/penny-v02.tar.xz

          # This workflow expands the implementation. The permanent CI workflow
          # is added separately so this bootstrap token never modifies another
          # workflow file.
          rm -f .github/workflows/backend.yml
          rm -rf .penny-bootstrap

      - name: Commit expanded implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'feat: add $penny v0.2 learning engine'
          git push
